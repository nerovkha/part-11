name: Periodic health check

on:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the deployed service
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://fullstackopen-pokedex.fly.dev/health
          max-attempts: 3
          retry-delay: 5s
